services:
  mysql:
    image: mysql:8.4
    container_name: sqlflow-demo-mysql
    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?kosa1004}
      MYSQL_DATABASE: sqlflow_demo

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: