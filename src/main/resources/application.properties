# 애플리케이션
spring.application.name=sqlflow
server.port=8080

# 프로젝트 루트의 DB 접속 설정 읽기
spring.config.import=optional:file:./application-local.properties

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 문자 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 오류 응답
server.error.include-message=never

# JSON 날짜
spring.jackson.time-zone=Asia/Seoul

# 정적 파일 캐시
spring.web.resources.cache.period=3600

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mapper/**/*.xml

# 개인 환경에서는 application-local.properties로 저장 위치를 변경한다.
app.execution.result-directory=./storage/query-results
#app.execution.query-timeout-seconds=60
#app.execution.max-file-bytes=104857600
