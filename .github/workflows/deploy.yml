name: SQLFlow CD

# Deploy only after the main-branch CI run succeeds.
on:
  workflow_run:
    workflows:
      - SQLFlow CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sqlflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SQLFLOW_EC2_INSTANCE_ID: ${{ vars.SQLFLOW_EC2_INSTANCE_ID }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Skip deployment if main has advanced
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -r '.sha')
          if [[ "$latest_sha" != "$SOURCE_SHA" ]]; then
            echo "Skipping stale CI run $SOURCE_SHA; main is now $latest_sha."
            echo "DEPLOY_CURRENT=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "DEPLOY_CURRENT=true" >> "$GITHUB_ENV"

      - name: Configure short-lived AWS credentials
        if: env.DEPLOY_CURRENT == 'true'
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sqlflow-cd-${{ github.run_id }}

      - name: Build and deploy the CI-verified commit on EC2 through SSM
        if: env.DEPLOY_CURRENT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy-ssm.sh <<'SCRIPT'
          set -Eeuo pipefail
          SOURCE_SHA=__SOURCE_SHA__
          REPO_URL=https://github.com/cheeseseasoning/team-project_sql-system.git
          SOURCE_DIR=/home/ubuntu/sqlflow-deploy/source
          APP_DIR=/home/ubuntu/sqlflow-deploy/app
          WAR_PATH="$APP_DIR/sqlflow.war"
          BACKUP_PATH="${WAR_PATH}.bak.$(date +%Y%m%d%H%M%S)"

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for tool in git mvn java curl; do
            command -v "$tool" >/dev/null || { echo "Missing required command: $tool" >&2; exit 1; }
          done
          test -f "$WAR_PATH"

          mkdir -p "$SOURCE_DIR"
          if ! git -C "$SOURCE_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$SOURCE_DIR" init
            git -C "$SOURCE_DIR" remote add origin "$REPO_URL"
          fi
          git -C "$SOURCE_DIR" remote set-url origin "$REPO_URL"
          git -C "$SOURCE_DIR" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$SOURCE_DIR" checkout --force --detach FETCH_HEAD

          cd "$SOURCE_DIR"
          export MAVEN_OPTS="-Xms128m -Xmx1024m -XX:MaxMetaspaceSize=256m"
          mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true clean package
          test -s "$SOURCE_DIR/target/sqlflow-0.0.1-SNAPSHOT.war"

          cp "$WAR_PATH" "$BACKUP_PATH"
          install -o ubuntu -g ubuntu -m 0644 \
            "$SOURCE_DIR/target/sqlflow-0.0.1-SNAPSHOT.war" "${WAR_PATH}.new"
          mv "${WAR_PATH}.new" "$WAR_PATH"

          if ! systemctl restart sqlflow; then
            mv "$BACKUP_PATH" "$WAR_PATH"
            systemctl restart sqlflow || true
            journalctl -u sqlflow -n 100 --no-pager || true
            exit 1
          fi

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/login >/dev/null; then
              echo "SQLFlow deployed from $SOURCE_SHA. Previous WAR backup: $BACKUP_PATH"
              exit 0
            fi
            sleep 5
          done

          echo "SQLFlow health check failed; restoring the previous WAR." >&2
          mv "$BACKUP_PATH" "$WAR_PATH"
          systemctl restart sqlflow || true
          journalctl -u sqlflow -n 100 --no-pager || true
          exit 1
          SCRIPT

          jq -n \
            --arg sha "$SOURCE_SHA" \
            --rawfile script deploy-ssm.sh \
            '{commands: [($script | gsub("__SOURCE_SHA__"; $sha))]}' \
            > ssm-commands.json

          command_id=$(aws ssm send-command \
            --instance-ids "$SQLFLOW_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-commands.json \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $command_id"

          for attempt in $(seq 1 360); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$SQLFLOW_EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$SQLFLOW_EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$SQLFLOW_EC2_INSTANCE_ID" \
                  --query '{status:Status,error:StandardErrorContent,output:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command." >&2
          exit 1
