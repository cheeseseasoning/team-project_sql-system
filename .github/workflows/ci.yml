name: SQLFlow CI

# main 대상 PR 생성·추가 커밋과 main 반영 시 실행합니다.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# 저장소 코드를 읽는 권한만 부여합니다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 검사를 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 나중에 main 보호 규칙에서 선택할 검사 이름입니다.
    name: build-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul

      # DB 연결 없이 실행 가능한 단위·MVC 테스트 목록입니다.
      # 실제 Oracle/MySQL 연결이 필요한 통합 테스트는 별도 DB CI 환경을
      # 마련한 뒤 추가합니다. 테스트를 추가하거나 이름을 바꾸면 목록도 갱신합니다.
      CI_TESTS: >-
        AccountServiceTest,
        AdminUserControllerTest,
        ApprovalDecisionServiceTest,
        ApprovalServiceTest,
        DataAccessValidationServiceTest,
        DepartmentRequestApiTest,
        DepartmentRequestServiceTest,
        DepartmentScheduleServiceTest,
        DmlSqlValidationServiceTest,
        ExecutionBatchAuthorizationTest,
        ExecutionBatchDispatchServiceTest,
        ExecutionBatchRecordServiceTest,
        ExecutionBatchRunServiceTest,
        ExecutionBatchStatusServiceTest,
        ExecutionQueueServiceTest,
        ExecutionResultAccessLogApiTest,
        ExecutionResultAccessServiceTest,
        ExecutionResultDeliveryServiceTest,
        ExecutionResultServiceTest,
        ExpiredResultCleanupBatchServiceTest,
        ExpiredResultCleanupSchedulerTest,
        ExpiredResultCleanupServiceTest,
        MySqlColumnResolverTest,
        MySqlQueryExecutionServiceTest,
        MySqlQueryMetadataValidationServiceTest,
        MyPasswordControllerTest,
        MyProfileControllerTest,
        OracleColumnValidationServiceTest,
        OracleObjectNameResolverTest,
        OracleTableValidationServiceTest,
        PageControllerTest,
        PasswordHashTest,
        QueryExecutionRecordServiceTest,
        QueryExecutionServiceTest,
        RemainingBatchControllerTest,
        RemainingBatchReservationTest,
        RequestSqlValidationServiceTest,
        RequestSubmissionServiceTest,
        ResultAccessLogServiceTest,
        ResultFileStorageServiceTest,
        SingleExecutionRecordServiceTest,
        SingleExecutionControllerTest,
        SingleExecutionWorkflowTest,
        SqlColumnQualifierValidatorTest,
        SqlConditionValidatorTest,
        SqlFlowUserDetailsServiceTest,
        SqlGroupingOrderValidatorTest,
        SqlParserValidatorTest,
        SqlSelectColumnExtractorTest,
        SqlSelectExpressionAnalyzerTest,
        SqlSelectListValidationServiceTest,
        SqlTableExtractorTest,
        ViewCreateResultWorkflowTest,
        ViewCreateSqlValidationServiceTest,
        ViewQueryControllerTest,
        ViewQueryServiceTest

    steps:
      - name: Checkout source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show build environment
        run: |
          java -version
          mvn -version

      - name: Run unit tests and build WAR
        shell: bash
        run: |
          set -euo pipefail

          # YAML 줄바꿈으로 생긴 공백을 제거해 Maven 테스트 목록을 만듭니다.
          tests="$(printf '%s' "$CI_TESTS" | tr -d '[:space:]')"

          mvn --batch-mode --no-transfer-progress \
            clean package \
            "-Dtest=$tests" \
            -DfailIfNoTests=true \
            -Dsurefire.failIfNoSpecifiedTests=true

      - name: Upload test reports
        # 테스트가 실패해도 원인 확인용 보고서를 보관합니다.
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload WAR
        # 검사와 패키징이 성공한 경우에만 WAR를 보관합니다.
        if: success()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sqlflow-war-${{ github.sha }}-${{ github.run_attempt }}
          path: target/*.war
          if-no-files-found: error
          retention-days: 14
